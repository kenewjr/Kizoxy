name: CI — Lint & Validate

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint & Prettier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm exec -- prettier --check .

      - name: Run ESLint
        run: npm run lint

  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate all JavaScript syntax
        run: find . -type f -name "*.js" ! -path "*/node_modules/*" -exec node --check {} \;

      - name: Validate Module Structures
        run: npm run validate:modules

      - name: Validate ENV Structure
        run: npm run validate:env

      - name: Run Unit Tests (Jest)
        run: npm test

      - name: Upload failed test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-node-${{ matrix.node }}
          path: tests/logs/latest-test-run.log
          if-no-files-found: ignore

  coverage:
    name: Coverage (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

      - name: Upload failed coverage log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-test-log-node-24
          path: tests/logs/latest-test-run.log
          if-no-files-found: ignore
